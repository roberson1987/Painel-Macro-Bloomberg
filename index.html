<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal Macro</title>

<style>
body {
  background: #0b0f14;
  color: #e6edf3;
  font-family: Arial;
}

h2 {
  color: #ffaa00;
  margin-top: 30px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 20px;
}

th, td {
  padding: 8px;
  text-align: left;
  border-bottom: 1px solid #1f2a33;
}

th {
  color: #8a99a8;
}

.green { color: #00ff9c; }
.red { color: #ff4d4f; }

.widget {
  height: 80px;
}
</style>

<script src="https://s3.tradingview.com/tv.js"></script>

</head>

<body>

<h1>📊 TERMINAL MACRO GLOBAL</h1>

<!-- ================= MACRO ================= -->
<h2>🌎 Macro</h2>
<table>
<tr><th>Ativo</th><th>Gráfico</th></tr>

<tr><td>DXY</td><td><div id="dxy" class="widget"></div></td></tr>
<tr><td>S&P500</td><td><div id="spx" class="widget"></div></td></tr>
<tr><td>VIX</td><td><div id="vix" class="widget"></div></td></tr>
<tr><td>US10Y</td><td><div id="us10y" class="widget"></div></td></tr>

</table>

<!-- ================= FOREX ================= -->
<h2>💱 Forex</h2>
<table>

<tr><th>Par</th><th>Gráfico</th></tr>

<tr><td>EURUSD</td><td><div id="eurusd"></div></td></tr>
<tr><td>GBPUSD</td><td><div id="gbpusd"></div></td></tr>
<tr><td>USDJPY</td><td><div id="usdjpy"></div></td></tr>

<tr><td>USDCAD</td><td><div id="usdcad"></div></td></tr>
<tr><td>USDCHF</td><td><div id="usdchf"></div></td></tr>
<tr><td>USDSEK</td><td><div id="usdsek"></div></td></tr>

<tr><td>USDBRL</td><td><div id="usdbrl"></div></td></tr>
<tr><td>USDMXN</td><td><div id="usdmxn"></div></td></tr>
<tr><td>USDZAR</td><td><div id="usdzar"></div></td></tr>

</table>

<!-- ================= COMMODITIES ================= -->
<h2>🛢️ Commodities</h2>
<table>

<tr><th>Ativo</th><th>Gráfico</th></tr>

<tr><td>Ouro</td><td><div id="gold"></div></td></tr>
<tr><td>Prata</td><td><div id="silver"></div></td></tr>
<tr><td>Petróleo</td><td><div id="oil"></div></td></tr>

</table>

<!-- ================= JUROS ================= -->
<h2>📉 Juros Globais</h2>
<table>

<tr><th>Ativo</th><th>Gráfico</th></tr>

<tr><td>US 2Y</td><td><div id="us2y"></div></td></tr>
<tr><td>US 5Y</td><td><div id="us5y"></div></td></tr>
<tr><td>US 10Y</td><td><div id="us10y2"></div></td></tr>

</table>

<script>

function widget(id, symbol) {
  new TradingView.widget({
    "container_id": id,
    "symbol": symbol,
    "width": "100%",
    "height": 80,
    "theme": "dark",
    "style": "1",
    "hide_top_toolbar": true,
    "hide_legend": true
  });
}

/* MACRO */
widget("dxy", "TVC:DXY");
widget("spx", "SP:SPX");
widget("vix", "TVC:VIX");
widget("us10y", "TVC:US10Y");

/* FOREX */
widget("eurusd", "FX:EURUSD");
widget("gbpusd", "FX:GBPUSD");
widget("usdjpy", "FX:USDJPY");

widget("usdcad", "FX:USDCAD");
widget("usdchf", "FX:USDCHF");
widget("usdsek", "FX:USDSEK");

widget("usdbrl", "FX:USDBRL");
widget("usdmxn", "FX:USDMXN");
widget("usdzar", "FX:USDZAR");

/* COMMODITIES */
widget("gold", "OANDA:XAUUSD");
widget("silver", "OANDA:XAGUSD");
widget("oil", "TVC:USOIL");

/* JUROS */
widget("us2y", "TVC:US02Y");
widget("us5y", "TVC:US05Y");
widget("us10y2", "TVC:US10Y");

</script>

</body>
</html>
