<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Painel Macro - Bloomberg Style</title>

<style>
body {
  background: #0b0f14;
  color: #00ffcc;
  font-family: Arial;
}

h2 {
  color: #ffaa00;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.box {
  border: 1px solid #1f2a33;
  padding: 8px;
  background: #11161c;
}

</style>

<script src="https://s3.tradingview.com/tv.js"></script>

</head>

<body>

<h1>📊 PAINEL MACRO GLOBAL</h1>

<!-- ================= MACRO ================= -->
<h2>🌎 Macro</h2>
<div class="grid">

<div class="box" id="dolar"></div>
<div class="box" id="spx"></div>
<div class="box" id="us10y"></div>

</div>

<!-- ================= FOREX ================= -->
<h2>💱 Forex</h2>
<div class="grid">

<div class="box" id="eurusd"></div>
<div class="box" id="gbpusd"></div>
<div class="box" id="usdjpy"></div>

<div class="box" id="usdcad"></div>
<div class="box" id="usdchf"></div>
<div class="box" id="usdsek"></div>

<div class="box" id="usdmxn"></div>
<div class="box" id="usdzar"></div>
<div class="box" id="usdbrl"></div>

</div>

<!-- ================= COMMODITIES ================= -->
<h2>🛢️ Commodities</h2>
<div class="grid">

<div class="box" id="gold"></div>
<div class="box" id="oil"></div>
<div class="box" id="silver"></div>

</div>

<script>

function createWidget(id, symbol) {
  new TradingView.widget({
    "container_id": id,
    "symbol": symbol,
    "width": "100%",
    "height": 250,
    "theme": "dark",
    "style": "1",
    "hide_top_toolbar": true,
    "hide_legend": true
  });
}

/* MACRO */
createWidget("dolar", "FX:USDBRL");
createWidget("spx", "SP:SPX");
createWidget("us10y", "TVC:US10Y");

/* FOREX */
createWidget("eurusd", "FX:EURUSD");
createWidget("gbpusd", "FX:GBPUSD");
createWidget("usdjpy", "FX:USDJPY");

createWidget("usdcad", "FX:USDCAD");
createWidget("usdchf", "FX:USDCHF");
createWidget("usdsek", "FX:USDSEK");

createWidget("usdmxn", "FX:USDMXN");
createWidget("usdzar", "FX:USDZAR");
createWidget("usdbrl", "FX:USDBRL");

/* COMMODITIES */
createWidget("gold", "OANDA:XAUUSD");
createWidget("oil", "TVC:USOIL");
createWidget("silver", "OANDA:XAGUSD");

</script>

</body>
</html>
