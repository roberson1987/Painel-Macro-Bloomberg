<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal de Cotações</title>

<style>
body {
  background: #0b0f14;
  color: #e6edf3;
  font-family: Arial;
}

h2 {
  color: #ffaa00;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #1f2a33;
}

.green { color: #00ff9c; }
.red { color: #ff4d4f; }

</style>
</head>

<body>

<h1>📊 TERMINAL DE COTAÇÕES</h1>

<h2>💱 Forex</h2>
<table id="forex">
<tr>
<th>Ativo</th>
<th>Preço</th>
<th>Variação %</th>
</tr>
</table>

<h2>🛢️ Commodities</h2>
<table id="commodities">
<tr>
<th>Ativo</th>
<th>Preço</th>
<th>Variação %</th>
</tr>
</table>

<script>

const API_KEY = "SUA_API_AQUI";

const forex = [
"EUR/USD",
"GBP/USD",
"USD/JPY",
"USD/CAD",
"USD/CHF",
"USD/SEK",
"USD/BRL"
];

const commodities = [
"XAU/USD",
"XAG/USD"
];

function addRow(tableId, symbol, price, change) {
  let table = document.getElementById(tableId);

  let color = change >= 0 ? "green" : "red";

  let row = `
    <tr>
      <td>${symbol}</td>
      <td>${price}</td>
      <td class="${color}">${change}%</td>
    </tr>
  `;

  table.innerHTML += row;
}

async function loadData() {

  forex.forEach(async (symbol) => {
    let res = await fetch(`https://api.twelvedata.com/quote?symbol=${symbol}&apikey=${API_KEY}`);
    let data = await res.json();

    addRow("forex", symbol, data.close, data.percent_change);
  });

  commodities.forEach(async (symbol) => {
    let res = await fetch(`https://api.twelvedata.com/quote?symbol=${symbol}&apikey=${API_KEY}`);
    let data = await res.json();

    addRow("commodities", symbol, data.close, data.percent_change);
  });

}

loadData();

</script>

</body>
</html>
